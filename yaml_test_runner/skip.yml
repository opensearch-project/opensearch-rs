"*":
  features: # features not yet implemented
    - node_selector
    - stash_path_replace
    - embedded_stash_key
  tests:
    free/cat.aliases/10_basic.yml:
      # this test fails as the regex needs a \n before the ending $
      - Multiple alias names
    free/cluster.health/10_basic.yml:
      # Exercises pre-ES-7.2.0 behavior (closed indices not replicated). Its
      # upstream skip is `version: "7.2.0 - "`, which never matches OpenSearch
      # version numbers (1.x onwards), so the test runs even though every
      # OpenSearch version derives from ES 7.10+: waiting for green after
      # closing an index with unassignable replicas times out with a 408
      - cluster health with closed index (pre 7.2.0)
    free/search/10_source_filtering.yml:
      # The yaml tests from main expect deprecation warnings for empty _source
      # values that OpenSearch distributions do not emit: verified missing on
      # released versions up to 3.7.0 and on a 3.9.0 nightly (staging) build
      - "_source as an empty object"
      - "_source as an empty array"
      - "_source as object with an empty excludes array"
      - "_source as object with an empty includes array"

"<3.0.0":
  tests:
    free/cluster.put_settings/10_basic.yml:
      # On 2.x the ISM plugin writes its own persistent setting
      # (plugins.index_state_management.template_migration.control), which the
      # test's exact match on the whole persistent settings object rejects.
      # Verified passing on 3.0.0 and later
      - Test put and reset persistent settings

">=3.0.0, <3.2.0":
  when_secure:
    tests:
      free/search.aggregation/20_terms.yml:
        # With the security plugin enabled, a terms aggregation with
        # value_type string on an unmapped field fails shard-side with
        # `Cannot invoke "String.endsWith(String)" because "field" is null`,
        # returning partial results with hits.total 0. Server-side bug in
        # 3.0.x/3.1.x, fixed in 3.2.0; insecure clusters are unaffected.
        - "Unmapped strings"
