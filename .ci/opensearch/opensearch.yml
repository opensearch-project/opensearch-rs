network.host: 0.0.0.0
node.name: instance
cluster.name: search-rest-test
cluster.initial_master_nodes: instance
discovery.seed_hosts: instance
cluster.routing.allocation.disk.threshold_enabled: false
bootstrap.memory_lock: true
node.attr.testattr: test
path.repo: /tmp
repositories.url.allowed_urls: http://snapshot.test*
action.destructive_requires_name: false
# Query Insights exports top queries to a non-hidden top_queries-* index in
# the background, leaking documents into cluster-wide searches that yaml
# tests assert exact hit counts on. The start-opensearch action strips these
# settings for min distributions that do not bundle the plugin.
search.insights.top_queries.latency.enabled: false
search.insights.top_queries.cpu.enabled: false
search.insights.top_queries.memory.enabled: false